name: CI

# Runs on every push and pull request. The tests use only Node builtins, so
# there is no install step and nothing to keep in sync with a lockfile.
on:
  push:
    branches: ['**']
  pull_request:
  # Lets you re-run the checks by hand from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    name: Unit and render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: node --test tests/snap-screening-logic.test.js tests/render-smoke.test.js

  static-checks:
    name: Page script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check page scripts parse and files are valid UTF-8
        run: node scripts/check-pages.js

  # The screening logic exists twice: JavaScript for the web builds, Python for
  # the Docassemble port. This job is the only thing that notices when someone
  # changes a rule in one and not the other. It needs no dependencies; the tests
  # use the standard library and read their expectations from decision-spec.json,
  # which is generated from the JavaScript.
  decision-parity:
    name: Docassemble port matches the reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decision logic parity
        run: python docassemble-snap-abawd/tests/test_snap_abawd_parity.py

      - name: Good cause statement wording
        run: python docassemble-snap-abawd/tests/test_good_cause_text.py

  # Several files in the repo are generated from the code, and going stale is
  # silent. The two copy documents going stale is the worst case: the author
  # would be reviewing copy the tool no longer has, and SCREENER-WALKTHROUGH.md
  # would be demonstrating a letter it no longer writes. Regenerating on a clean
  # checkout must produce no diff.
  #
  # Together with decision-parity above this closes the loop. Change a rule and
  # forget to regenerate the spec, this job fails. Regenerate the spec and forget
  # to update the Python, that job fails.
  generated-files:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # decision-spec.js writes the JSON that gen-docassemble.js reads, so the
      # order matters.
      - name: Regenerate
        run: |
          node scripts/copy-doc.js
          node scripts/copy-walkthrough.js
          node scripts/decision-spec.js
          node scripts/gen-docassemble.js

      - name: Fail if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated files are current."
          else
            echo "::error::Generated files are out of date. Run the generators listed in CLAUDE.md and commit the result."
            git diff --stat
            git diff
            exit 1
          fi

  # The browser tests cannot run on the authoring machine, so before this job
  # existed they ran nowhere. That is how five assertions in the spec came to
  # reference an exempt heading the author had already changed: nothing executed
  # them. A suite that never runs is worse than no suite, because it reads like
  # coverage.
  #
  # Heavier than the other jobs, since it installs Playwright and a browser. It is
  # the only place these paths are exercised end to end, which earns the minutes.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm install, not npm ci: there is no lockfile, and adding one for a single
      # dev dependency would need keeping in sync for no benefit here.
      - name: Install Playwright
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test --project=chromium

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Catches the failure that looks fine in the preview site and 404s in
  # production: a parent-relative or rooted path in the build that gets served
  # from a path on masslegalhelp.org. Guards only, so it changes nothing.
  shipping-build:
    name: Shipping build is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish guards
        run: node scripts/publish-mlh.js --check
