---
question: |
  Did DTA tell you that you need to meet ABAWD Work Rules to keep getting SNAP?
subquestion: |
  Some adults on SNAP who are **18 through 64** have to meet ABAWD work rules to get SNAP for more than 3 months. **Many adults are exempt**. Being "exempt" means that you don’t have to meet the work rules to keep getting SNAP.

  This short online form asks a few questions to check if you need to meet the ABAWD work rules or if you are exempt. **It takes less than 2 minutes.**

  **Your information is private.** MLRI will not save any personal information you share on this form.
continue button field: introduction
---
question: "Your Family and Household"
subquestion: |
  Answer any that apply to you. Every question is optional.
fields:
  - "Are you 18 through 64 years old?": ageRange
    datatype: yesnoradio
    required: False
  - "Do you live with a child under 14 years old?": child14
    datatype: yesnoradio
    required: False
    help: |
      If you live with a child under 14 who should be part of your [SNAP household](https://www.masslegalhelp.org/public-benefits-ssi/snap-food-benefits/34-what-snap-household-or-assistance-unit), even if they are not eligible (for example, because of immigration status or if they are a foster child), select “Yes.”
  - "Do you take care of a child under 6 years old?": child6
    datatype: yesnoradio
    required: False
    help: |
      You do not need to be related to them, live with them, or provide care full-time.
  - "Do you take care of a child or adult who cannot care for themselves?": caretaker
    datatype: yesnoradio
    required: False
    help: |
      You do not need to be related to them, live with them, or provide care full-time.
      Caring for someone means you regularly do things like make food, help with daily tasks like bathing and personal care, run errands for them, and monitor their health and wellbeing. If you are an [Adult Foster Care provider](https://www.masslegalhelp.org/public-benefits-ssi/snap-food-benefits/adult-foster-care-and-snap), answer “Yes.”
  - "Are you pregnant?": pregnant
    datatype: yesnoradio
    required: False
continue button field: family_group
---
question: "Your health, housing, and safety"
fields:
  - "Do you have a health reason or disability that makes it hard to work at least 30 hours a week?": health
    datatype: yesnoradio
    required: False
    help: |
      It can be a physical or mental health reason, and short- or long-term.
  - "Do you have a regular place to sleep at night?": housing
    datatype: yesnoradio
    required: False
    help: |
      Choose “No” if you are experiencing homelessness or unstable housing, like living in a shelter or couch surfing.
  - "Please choose all that apply:": housingFollowup
    datatype: checkboxes
    choices:
      - "I have a high school diploma (including GED or HiSet)": diploma
      - "I regularly see a health care provider for an ongoing illness, like a dentist, therapist, psychiatrist, or doctor for ongoing treatment": ongoing_care
      - "I have had a steady job for at least 6 months in the last year": steady_job
      - "I have been a full-time student for at least 6 months in the last year": full_time_student
      - "I have been hospitalized in the last 6 months": hospitalized
      - "None of the above": "__none"
    required: False
    show if:
      variable: housing
      is: "no"
  - "Has a domestic violence or safety situation made it hard for you to work?": dv
    datatype: yesnoradio
    required: False
    help: |
      This includes stalking, harassment, abuse, assault, or any health/safety concerns that make it hard for you to work. DTA has domestic violence specialists in each local office who can help. Find their [contact info here](https://www.mass.gov/info-details/dta-domestic-violence-services). Your answer stays private.
continue button field: health_group
---
question: "Public Benefits and Participating in Programs"
fields:
  - "Do you get, or are you applying for TAFDC cash assistance benefits?": tafdc
    datatype: yesnoradio
    required: False
  - "Do you get any of these disability benefits?": disability
    datatype: checkboxes
    choices:
      - "EAEDC": eaedc
      - "Veteran’s disability benefit": veteran
      - "Workers’ compensation": workers_comp
      - "Paid Family Medical Leave": pfml
      - "Short-term disability": std
      - "SSI or SSDI": ssi_ssdi
      - "Other disability benefit or payment": other
      - "None of the above": "__none"
    required: False
    help: |
      Choose Other only if you receive a disability benefit or payment that is not listed above. Tell DTA the name of the benefit or payment so they can review it.
  - "Are you participating in a substance use treatment program?": substanceUse
    datatype: yesnoradio
    required: False
    help: |
      It does not have to be a daily program.
  - "Do you get, or are you applying for unemployment benefits?": unemployment
    datatype: yesnoradio
    required: False
  - "Do you get services from any of these state agencies?": stateagency
    datatype: yesnoradio
    required: False
    help: |
      - MassAbility
      - Dept. of Mental Health
      - Dept. of Developmental Services
      - MA Commission for the Blind
      - MA Commission for Deaf and Hard of Hearing
continue button field: benefits_group
---
question: "School, work, and background"
fields:
  - "Are you enrolled in school half-time or more?": school
    datatype: yesnoradio
    required: False
    help: |
      This includes high school, vocational/technical school, college, or any education and training program. You can ask your school if you're unsure if you are enrolled half-time or more.
  - "Are you currently working for pay?": working
    datatype: radio
    choices:
      - "Yes, I am making $217.50 a week or more (before taxes)": income_weekly
      - "Yes, I am working at least 14.5 hours a week at $15 or more an hour": hours_min_wage
      - "Yes, I am working 30 hours or more a week (I make less than minimum wage)": hours_30
      - "None of the above": "__none"
    required: False
    help: |
      Choose the option that applies to you.
  - "Are you an Alaska native or a member of an American Indian, Urban Indian, or California Indian tribe?": tribe
    datatype: yesnoradio
    required: False
    help: |
      Choose “Yes” if you have a parent or grandparent who is a member of one of these tribes.
continue button field: school_work_group
---
question: "Is something making it hard to work, go to school, or volunteer right now?"
fields:
  - "Is something making it hard to work, go to school, or volunteer right now?": goodcause
    datatype: radio
    choices:
      - "Yes — my ride broke down or I have temporary transportation issues": transport
      - "Yes, I have a family or personal emergency": emergency
      - "Yes, I’m dealing with unreasonable employment": employment
      - "This question does not apply to me / I’m not sure": "__none"
    required: False
    help: |
      These are situations where you missed work, school, or volunteering hours for one or more months because of an unexpected life event.
continue button field: good_cause_group
---
event: results_screen
question: |
  % if outcome == 'exempt':
  You may be exempt and do not need to meet the ABAWD work rules because of these reasons:
  % elif outcome == 'goodcause':
  You may have a good reason for missing hours
  % else:
  You may need to meet the ABAWD work rules
  % endif
subquestion: |
  % if outcome == 'exempt':
  % for reason in reasons:
  * ${ reason }
  % endfor

  To tell DTA you are exempt, you can fill in the blanks below with your results and send it to DTA.
  % elif outcome == 'goodcause':
  This includes missing work, school, or volunteer hours before or after your start date.

  To tell DTA why you missed work hours, you can fill in the blanks below with your results and send it to DTA.
  % else:
  Based on your responses, you may not be exempt from the ABAWD work rules.

  To keep getting SNAP, you can meet the ABAWD work rules by doing one of these:
  % endif

  **Your information is private.** MLRI will not save any personal information you share on this form.
attachment code: tell_dta_statement if outcome in ('exempt', 'goodcause') else []
buttons:
  - Start over: restart
---
attachment:
  name: SNAP Work Rules Statement
  filename: snap-work-rules-statement
  valid formats:
    - pdf
    - docx
  variable name: tell_dta_statement
  content: |
    # SNAP Work Rules Statement

    Your name: ${ client_name if defined('client_name') else '' }

    Client / Agency ID (if you have one): ${ agency_id if defined('agency_id') else '' }

    % if outcome == 'exempt':
    I believe I do not have to meet the ABAWD work rules for these reasons:

    % for reason in reasons:
    * ${ reason }
    % endfor
    % else:
    I could not meet the ABAWD work rules for this reason:

    * ${ good_cause_text }
    % endif

    In my own words:

    ${ explanation if defined('explanation') else '' }

    Signature: ______________________________  Date: ${ today() }
---
question: |
  Add your details to the statement
fields:
  - Your name: client_name
    required: False
  - Client / Agency ID (if you have one): agency_id
    required: False
  - In a few sentences: explanation
    datatype: area
    required: False
continue button field: statement_details
---
code: |
  good_cause_text = good_cause_statement_text(goodcause)
