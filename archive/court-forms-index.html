<!-- impeccable-disable single-font -- Atkinson Hyperlegible is the legibility choice for this audience; a display-font pairing would work against it. -->
<style>
  :root{--navy:#0a2b52;--blue:#134a8e;--soft:#eaf1fb;--yellow:#f4bd3f;--green:#1e7a45;--green-bg:#eaf6ee;--bg:#ffffff;--ink:#16202e;--muted:#5b6675;
    /* --line is the boundary of a clickable card, so it needs 3:1 on white
       (3.25:1 here), the same value the option borders use. --bar-link is the
       back link on the navy bar; it is not legible on the white page. */
    --line:#84909f;--lead-ink:#37414f;--bar-link:#cfe0f5}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0}
  body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden}
  a{color:var(--blue);text-underline-offset:3px}
  a:hover{color:var(--navy)}
  :focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
  /* A navy ring vanishes against the navy bar, so focus goes gold there. */
  .topbar :focus-visible{outline-color:var(--yellow)}
  .topbar{background:var(--navy);color:#fff}
  /* 7px + a 44px target keeps the bar at the 58px it was when the link was
     bare 15px text, so the touch target grows without the chrome moving. */
  .topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:7px max(24px,env(safe-area-inset-right)) 7px max(24px,env(safe-area-inset-left))}
  .topbar-brand{display:flex;align-items:center;gap:12px}
  .topbar-title{font-size:18px;font-weight:700}
  .topbar-back{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin-right:-6px;
    font-size:15px;color:var(--bar-link);text-decoration:none}
  .page{max-width:680px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right)) 72px max(16px,env(safe-area-inset-left))}
  h1{font-size:clamp(26px,6.5vw,34px);line-height:1.18;margin:0 0 12px;letter-spacing:-.01em}
  .lead{font-size:clamp(17px,4.2vw,19px);line-height:1.55;color:var(--lead-ink);margin:0 0 28px}
  .row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;text-decoration:none;color:inherit;
    transition:border-color .15s ease,transform .15s ease}
  .row:hover{border-color:var(--blue);transform:translateY(-1px)}
  @media (prefers-reduced-motion:reduce){
    .row{transition:none}
    .row:hover{transform:none}
  }
  .dot{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff}
  .dot svg{width:21px;height:21px;display:block}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:18px;font-weight:700;line-height:1.25}
  .row .d{font-size:15px;color:var(--muted);line-height:1.45;margin-top:2px}
  .row .arrow{color:var(--blue);font-weight:700;flex:none}
</style>
</head>
<body>

      <div class="topbar-title">Court Forms Online</div>
    </div>
    <a class="topbar-back" href="../">← Marlie's MLRI Work</a>
  </div>
</header>

<main class="page">
